

<div style="display: flex; flex-direction: column; align-items: center; width: 100%; font-family: sans-serif; gap: 20px;">
    <div style="display: flex; justify-content: center; gap: 15px; width: 100%; max-width: 1200px;">
        <div style="width: 49%; position: relative; background: #000; border-radius: 12px; aspect-ratio: 16/9; overflow: hidden;">
            <div id="playerA" style="width: 100%; height: 100%; pointer-events: none;"></div>
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;"></div>
        </div>
        <div style="width: 49%; position: relative; background: #000; border-radius: 12px; aspect-ratio: 16/9; overflow: hidden;">
            <div id="playerB" style="width: 100%; height: 100%; pointer-events: none;"></div>
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;"></div>
        </div>
    </div>

    <div style="width: 95%; max-width: 1100px; background: #ffffff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; gap: 15px;">
        <div style="width: 100%; display: flex; align-items: center; gap: 15px;">
            <button id="playBtn" style="padding: 10px 20px; border: none; border-radius: 8px; background: #ccc; color: white; cursor: not-allowed; font-weight: bold;" disabled>Loading...</button>
            <input type="range" id="seekBar" value="0" step="0.1" style="flex-grow: 1; cursor: pointer;">
            <span id="curTime" style="min-width: 50px; font-weight: bold;">0:00</span>
        </div>
        <div style="display: flex; gap: 30px; border-top: 1px solid #eee; padding-top: 15px; width: 100%; justify-content: center;">
            <label style="cursor: pointer;"><input type="checkbox" id="cA" checked> ⬅️ 왼쪽 음원 듣기 (기준)</label>
            <label style="cursor: pointer;"><input type="checkbox" id="cB"> ➡️ 오른쪽 음원 듣기 (이용자)</label>
        </div>
    </div>
    <div style="font-size: 13px; color: #555;">
            두 연주를 동시에 재생하며 비교해 보세요.
    </div>
</div>

<script>
  {{CUSTOM_JS}}
</script>
